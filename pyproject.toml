[project]
name = "coding-agent-harness"
version = "0.1.0"
description = "A minimal coding agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=3.5.0", "rich>=15.0.0", "pyyaml>=6.0.3", "python-dotenv>=1.0.0", "prompt-toolkit>=3.0.53"]

[project.scripts]
coding-agent-harness = "coding_agent_harness.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
